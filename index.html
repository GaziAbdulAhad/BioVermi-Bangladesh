<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BioVermi Bangladesh — সম্পূর্ণ প্ল্যাটফর্ম</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
/* ============================================================
   BioVermi Bangladesh — Premium Design System (CSS)
   ============================================================ */
@import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap');

:root{
  --forest:#1b4332; --leaf:#2d6a4f; --leaf-2:#40916c; --leaf-3:#52b788;
  --earth:#7f5539; --earth-2:#9c6644; --gold:#b08968;
  --warm-white:#fdfcf7; --beige:#f2ede3;
  --surface:#ffffff; --surface-2:#f7f4ec;
  --border:#e4ddcf; --border-2:#d9d1bf;
  --text:#1f2a24; --text-2:#4d5b53; --muted:#8a978f;
  --danger:#b23a48; --warn:#c07a1c; --ok:#2d6a4f; --info:#2c6e91;
  --shadow:0 1px 2px rgba(27,67,50,.06),0 4px 16px rgba(27,67,50,.06);
  --shadow-lg:0 10px 40px rgba(27,67,50,.14);
  --radius:14px; --radius-sm:10px; --radius-lg:22px;
  --sidebar-w:288px; --topbar-h:64px;
}
[data-theme="dark"]{
  --forest:#0f2e22; --leaf:#52b788; --leaf-2:#74c69d; --leaf-3:#95d5b2;
  --earth:#a07a52; --earth-2:#b08968; --gold:#d4a373;
  --warm-white:#0b120e; --beige:#111a15;
  --surface:#141e18; --surface-2:#18241d;
  --border:#243029; --border-2:#2e3d34;
  --text:#e9efe9; --text-2:#b3c2b8; --muted:#7f8f85;
  --danger:#e07a86; --warn:#e0a84a; --ok:#74c69d; --info:#6fb3d2;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 16px rgba(0,0,0,.35);
  --shadow-lg:0 10px 40px rgba(0,0,0,.55);
}

*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:'Hind Siliguri','Inter',system-ui,sans-serif;
  background:var(--warm-white); color:var(--text);
  line-height:1.75; font-size:15.5px;
  transition:background .25s ease,color .25s ease;
}
h1,h2,h3,h4,h5{font-family:'Hind Siliguri','Inter',sans-serif;line-height:1.35;color:var(--text)}
h1{font-size:2rem;font-weight:700} h2{font-size:1.45rem;font-weight:700} h3{font-size:1.15rem;font-weight:600} h4{font-size:1rem;font-weight:600}
a{color:var(--leaf-2);text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}

/* Layout */
.app{display:flex;min-height:100vh}
.sidebar{
  width:var(--sidebar-w);flex-shrink:0;background:var(--surface);
  border-right:1px solid var(--border);position:fixed;top:0;left:0;bottom:0;
  display:flex;flex-direction:column;z-index:60;transition:transform .28s ease;
}
.sidebar-brand{display:flex;align-items:center;gap:12px;padding:18px 20px;border-bottom:1px solid var(--border);}
.brand-mark{width:42px;height:42px;border-radius:12px;flex-shrink:0;background:linear-gradient(135deg,var(--leaf) 0%,var(--leaf-3) 100%);display:grid;place-items:center;color:#fff;font-size:22px;box-shadow:0 4px 14px rgba(45,106,79,.35);}
.brand-text b{display:block;font-size:1rem;line-height:1.2}
.brand-text span{font-size:11.5px;color:var(--muted);letter-spacing:.3px}
.sidebar-scroll{overflow-y:auto;flex:1;padding:12px 10px 20px}
.sidebar-scroll::-webkit-scrollbar{width:6px}
.sidebar-scroll::-webkit-scrollbar-thumb{background:var(--border-2);border-radius:4px}

.nav-group{margin-bottom:6px}
.nav-group-title{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);padding:12px 14px 6px;font-weight:600;}
.nav-item{display:flex;align-items:center;gap:11px;padding:9px 13px;border-radius:10px;color:var(--text-2);font-size:14.2px;font-weight:500;cursor:pointer;transition:.18s;user-select:none;}
.nav-item:hover{background:var(--surface-2);color:var(--leaf-2)}
.nav-item.active{background:linear-gradient(90deg,rgba(82,183,136,.16),rgba(82,183,136,.04));color:var(--leaf-2);font-weight:600}
.nav-item .ico{font-size:17px;width:22px;text-align:center;flex-shrink:0}
.nav-sub .nav-item{padding:7px 13px 7px 40px;font-size:13.4px;color:var(--muted)}

.main{flex:1;margin-left:var(--sidebar-w);min-width:0;display:flex;flex-direction:column}
.topbar{height:var(--topbar-h);position:sticky;top:0;z-index:40;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:14px;padding:0 22px;}
.icon-btn{width:40px;height:40px;border-radius:11px;border:1px solid var(--border);background:var(--surface);color:var(--text-2);display:grid;place-items:center;font-size:16px;transition:.18s;}
.icon-btn:hover{background:var(--surface-2);color:var(--leaf-2);}
.hamburger{display:none}
.search-wrap{position:relative;flex:1;max-width:520px}
.search-wrap input{width:100%;height:42px;border-radius:11px;border:1px solid var(--border);background:var(--surface-2);padding:0 16px 0 42px;font-size:14px;color:var(--text);font-family:inherit;outline:none;transition:.18s;}
.search-wrap input:focus{border-color:var(--leaf-3);background:var(--surface);box-shadow:0 0 0 4px rgba(82,183,136,.12)}
.search-wrap .s-ico{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:15px}
.search-results{position:absolute;top:calc(100% + 8px);left:0;right:0;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-lg);max-height:420px;overflow-y:auto;display:none;z-index:80;}
.search-results.show{display:block}
.sr-item{padding:11px 16px;border-bottom:1px solid var(--border);cursor:pointer;display:flex;flex-direction:column;gap:2px;}
.sr-item:hover{background:var(--surface-2)}
.sr-item b{font-size:14px;font-weight:600}
.sr-item span{font-size:12.2px;color:var(--muted)}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:10px;}
.avatar{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--earth),var(--gold));display:grid;place-items:center;color:#fff;font-weight:700;font-size:14px;}
.content{padding:28px 30px 60px;max-width:1240px;width:100%;margin:0 auto}

/* UI Elements */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);}
.card-pad{padding:20px}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,1fr)} .g3{grid-template-columns:repeat(3,1fr)} .g2{grid-template-columns:repeat(2,1fr)}
.stat{padding:18px 18px 16px;position:relative;border-radius:var(--radius);background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow);transition:.2s;}
.stat:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg);border-color:var(--leaf-3)}
.stat .s-top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.stat .s-ico{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-size:17px;background:rgba(82,183,136,.14);color:var(--leaf-2)}
.stat.info .s-ico{background:rgba(44,110,145,.15);color:var(--info)}
.stat.earth .s-ico{background:rgba(176,137,104,.18);color:var(--earth-2)}
.stat.warn .s-ico{background:rgba(192,122,28,.15);color:var(--warn)}
.stat .s-label{font-size:12.6px;color:var(--muted);font-weight:500}
.stat .s-value{font-size:1.55rem;font-weight:700;line-height:1.2;letter-spacing:-.3px}
.stat .s-sub{font-size:12px;color:var(--muted);margin-top:3px}
.stat .s-tag{position:absolute;top:14px;right:14px;font-size:10px;letter-spacing:.5px;padding:2px 8px;border-radius:20px;background:var(--surface-2);color:var(--muted);text-transform:uppercase;font-weight:600;}
.stat .s-tag.demo{background:rgba(192,122,28,.18);color:var(--warn)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:42px;padding:0 18px;border-radius:11px;font-size:14px;font-weight:600;transition:.18s;text-decoration:none;}
.btn-primary{background:linear-gradient(135deg,var(--leaf),var(--leaf-3));color:#fff;box-shadow:0 4px 14px rgba(45,106,79,.28)}
.btn-primary:hover{filter:brightness(1.06);transform:translateY(-1px)}
.btn-ghost{background:var(--surface);border:1px solid var(--border);color:var(--text-2)}
.btn-ghost:hover{background:var(--surface-2);color:var(--leaf-2);border-color:var(--leaf-3)}

.hero{position:relative;overflow:hidden;border-radius:var(--radius-lg);padding:44px 40px;margin-bottom:28px;background:linear-gradient(135deg,#1b4332 0%,#2d6a4f 55%,#40916c 100%);color:#fff;box-shadow:var(--shadow-lg);}
.hero .eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:12px;letter-spacing:1.4px;text-transform:uppercase;background:rgba(255,255,255,.14);padding:5px 14px;border-radius:20px;margin-bottom:16px;font-weight:600;}
.hero h1{color:#fff;font-size:2.2rem;max-width:720px;line-height:1.28;margin-bottom:12px;}
.hero p{color:rgba(255,255,255,.86);max-width:640px;margin-bottom:22px;}
.hero-actions{display:flex;gap:12px;flex-wrap:wrap;}
.hero .btn-primary{background:#fff;color:var(--forest);}
.hero .btn-ghost{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.3);color:#fff;}

.mod-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.mod-card{padding:20px;border-radius:var(--radius);background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow);cursor:pointer;transition:.2s;display:flex;flex-direction:column;gap:10px;}
.mod-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg);border-color:var(--leaf-3)}
.mod-card .num{width:38px;height:38px;border-radius:10px;background:rgba(82,183,136,.14);color:var(--leaf-2);display:grid;place-items:center;font-weight:700;font-size:14px;}
.mod-card h4{font-size:1rem;line-height:1.4}
.mod-card p{font-size:13px;color:var(--text-2);line-height:1.6;margin:0}
.mod-card .meta{margin-top:auto;display:flex;gap:12px;font-size:11.8px;color:var(--muted);padding-top:8px;border-top:1px dashed var(--border)}

/* Module View */
.lesson-layout{display:grid;grid-template-columns:1fr 260px;gap:28px;align-items:start}
.lesson-toc{position:sticky;top:calc(var(--topbar-h) + 20px);background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;font-size:13px;}
.lesson-toc b{display:block;font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin-bottom:10px}
.lesson-toc a{display:block;padding:6px 8px;border-radius:7px;color:var(--text-2);font-size:12.8px;line-height:1.4;border-left:2px solid transparent;cursor:pointer;}
.lesson-toc a:hover{background:var(--surface-2);color:var(--leaf-2)}
.lesson-section{margin-bottom:32px;}
.lesson-section h2{display:flex;align-items:center;gap:10px;padding-bottom:10px;margin-bottom:14px;border-bottom:2px solid var(--border);font-size:1.3rem;}
.lesson-section h2::before{content:'';width:6px;height:22px;border-radius:3px;background:linear-gradient(180deg,var(--leaf-3),var(--leaf));}
.lesson-section p{margin-bottom:12px;color:var(--text-2);font-size:15px}
.lesson-section ul{margin:10px 0 16px 22px;color:var(--text-2)}
.lesson-section li{margin-bottom:6px;font-size:14.6px}

.table-wrap{overflow-x:auto;margin:16px 0;border:1px solid var(--border);border-radius:var(--radius-sm)}
table{width:100%;border-collapse:collapse;font-size:13.6px;background:var(--surface);min-width:520px}
th,td{padding:10px 13px;text-align:left;border-bottom:1px solid var(--border);vertical-align:top}
th{background:var(--surface-2);font-weight:600;color:var(--text);font-size:12.6px;text-transform:uppercase;}
tr:last-child td{border-bottom:none}

.callout{border-radius:var(--radius-sm);padding:15px 18px;margin:16px 0;border-left:4px solid var(--info);background:rgba(44,110,145,.08);font-size:14px;}
.callout.warn{border-color:var(--warn);background:rgba(192,122,28,.09)}
.callout.danger{border-color:var(--danger);background:rgba(178,58,72,.08)}
.callout b{display:block;margin-bottom:4px}

/* Forms */
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;font-weight:600;margin-bottom:6px;}
.input{width:100%;height:44px;border-radius:10px;border:1px solid var(--border);background:var(--surface-2);padding:0 14px;font-size:14px;color:var(--text);outline:none;}
.input:focus{border-color:var(--leaf-3);background:var(--surface);}
.calc-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.calc-result{background:linear-gradient(135deg,rgba(82,183,136,.12),rgba(45,106,79,.06));border:1px solid rgba(82,183,136,.3);border-radius:var(--radius);padding:20px;margin-top:16px;}
.res-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px dashed var(--border);font-size:14px}
.res-row span:last-child{font-weight:700;color:var(--leaf-2)}
.steps{font-size:12.6px;color:var(--text-2);background:var(--surface);border:1px dashed var(--border);border-radius:10px;padding:12px;margin-top:12px;}

.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px;border-bottom:1px solid var(--border);padding-bottom:12px}
.tab{padding:7px 15px;border-radius:9px;font-size:13.4px;font-weight:600;color:var(--text-2);border:1px solid transparent;}
.tab.active{background:rgba(82,183,136,.14);color:var(--leaf-2);border-color:rgba(82,183,136,.3)}

/* Dashboard */
.chart-box{position:relative;height:280px;width:100%}
.task{display:flex;align-items:center;gap:11px;padding:11px 4px;border-bottom:1px solid var(--border);font-size:14px;}
.task:last-child{border-bottom:none}
.task input[type=checkbox]{width:17px;height:17px;accent-color:var(--leaf-2);cursor:pointer;}

@media(max-width:900px){
  .g4,.g3,.g2,.calc-grid,.lesson-layout{grid-template-columns:1fr}
  .sidebar{transform:translateX(-100%);}
  .sidebar.open{transform:translateX(0)}
  .main{margin-left:0}
  .hamburger{display:grid}
  .lesson-toc{display:none}
  .hero{padding:32px 24px}
}
</style>
</head>
<body>

<div class="app">
  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <div class="brand-mark">🌿</div>
      <div class="brand-text">
        <b>BioVermi BD</b>
        <span>কৃষি প্রযুক্তি প্ল্যাটফর্ম</span>
      </div>
    </div>
    <div class="sidebar-scroll" id="sidebar-nav">
      <!-- JS Inject -->
    </div>
  </aside>

  <!-- Main Content -->
  <div class="main">
    <header class="topbar">
      <button class="icon-btn hamburger" onclick="toggleSidebar()">☰</button>
      <div class="search-wrap">
        <span class="s-ico">🔍</span>
        <input id="globalSearch" type="text" placeholder="মডিউল, শব্দ বা বিষয় খুঁজুন..." autocomplete="off">
        <div class="search-results" id="searchResults"></div>
      </div>
      <div class="topbar-right">
        <button class="icon-btn" onclick="toggleTheme()">🌓</button>
        <div class="avatar">বাং</div>
      </div>
    </header>

    <div class="content" id="app-content">
      <!-- Dynamic Content Rendered Here -->
    </div>
  </div>
</div>

<script>
/* ============================================================
   1. Data (Modules & Glossary)
   ============================================================ */
const MODULES = [
  { id:'b1', part:'biogas', num:1, icon:'🔥', title:'বায়োগ্যাসের মৌলিক ধারণা', read:18, summary:'বায়োগ্যাস কী, কেন তৈরি হয়, গঠন, ব্যবহার, সুবিধা-সীমাবদ্ধতা — শূন্য থেকে বিস্তারিত।', sections:[ {h:'বায়োগ্যাস কী?', p:['বায়োগ্যাস হলো জৈব পদার্থের অবায়বীয় (অক্সিজেনের অনুপস্থিতিতে) পচনের ফলে উৎপন্ন দাহ্য গ্যাসের মিশ্রণ।','এটি অণুজীবের জৈব-রাসায়নিক কার্যক্রমের ফল।']} ] },
  { id:'b3', part:'biogas', num:3, icon:'🐄', title:'গোবর সংগ্রহ ও প্রস্তুতি', read:16, summary:'গোবর সংগ্রহ থেকে স্লারি প্রস্তুতি পর্যন্ত ধাপে ধাপে ব্যবহারিক নির্দেশনা ও ক্যালকুলেটর।', sections:[ {h:'সংগ্রহের পদ্ধতি', p:['প্রতিদিন নির্দিষ্ট সময়ে গোবর সংগ্রহ করুন।'], list:['তাজা গোবর ব্যবহার করুন','পানি মিশিয়ে স্লারি তৈরি করুন']} ] },
  { id:'b12', part:'biogas', num:12, icon:'💧', title:'Digestate ও স্লারি ব্যবস্থাপনা', read:26, summary:'Digestate কী, Solid-Liquid Separation, পুষ্টি উপাদান, নিরাপত্তা ও ব্যবহার।', sections:[ {h:'Digestate কী', p:['গ্যাস উৎপাদনের পর অবশিষ্ট তরল-কঠিন মিশ্রণকে Digestate বলে।']} ] },
  { id:'v17', part:'vermicompost', num:17, icon:'🪱', title:'ভার্মিকম্পোস্টের মৌলিক ধারণা', read:16, summary:'কেঁচো ও অণুজীবের সহযোগিতায় জৈব সার তৈরির বিজ্ঞান।', sections:[ {h:'Vermicompost কী', p:['কেঁচোর পরিপাকতন্ত্রের মাধ্যমে জৈব পদার্থ প্রক্রিয়াজাত হয়ে তৈরি হওয়া জৈব সার।']} ] },
  { id:'v26', part:'vermicompost', num:26, icon:'⭐', title:'Biogas Digestate → Vermicompost সমন্বয়', read:34, summary:'পুরো মডেলের কেন্দ্রীয় অধ্যায় — Digestate পরীক্ষা, প্রস্তুতি, পরীক্ষামূলক বেড ডিজাইন।', sections:[ {h:'কেন গুরুত্বপূর্ণ', p:['Digestate সরাসরি কেঁচোর বেডে দেওয়া যাবে না। pH, EC, অ্যামোনিয়া পরীক্ষা করতে হবে।']} ] },
  { id:'i40', part:'integrated', num:40, icon:'🔄', title:'সমন্বিত উৎপাদন প্রবাহ', read:24, summary:'গোবর থেকে চূড়ান্ত পণ্য পর্যন্ত পুরো প্রবাহ, Flow Balance ও নিয়ন্ত্রণ।', sections:[ {h:'প্রবাহ', p:['Cow Dung → Biogas → Digestate → Vermicompost']} ] }
];
// ডেমো হিসেবে ৬টি মডিউল রাখা হলো, কোড সংক্ষিপ্ত রাখার জন্য। চাইলে আরও ডাটা এখানে যোগ করা যাবে।

const PARTS = {
  biogas:{label:'বায়োগ্যাস উৎপাদন', icon:'🔥'},
  vermicompost:{label:'ভার্মিকম্পোস্ট উৎপাদন', icon:'🪱'},
  integrated:{label:'সমন্বিত খামার', icon:'🔄'}
};

/* ============================================================
   2. Core Utilities & State
   ============================================================ */
function toggleTheme(){
  const cur = document.documentElement.getAttribute('data-theme') || 'light';
  document.documentElement.setAttribute('data-theme', cur === 'dark' ? 'light' : 'dark');
}
function toggleSidebar(){

function navigate(hash) {

function getRoute() {

      </div>

          <div class="field"><label>গ্যাস উৎপাদন (m³/m³ slurry)</label><input id="bs-yield" class="input" type="number" value="0.9"></div>

        <button class="btn btn-primary" onclick="calcSizing()" style="margin-top:10px">হিসাব করুন</button>

      </div>
    </div>
  `;

function switchCalc(id, btn) {
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  btn.classList.add('active');
  document.querySelectorAll('.calc-panel').forEach(p=>p.style.display = 'none');
  document.getElementById('calc-'+id).style.display = 'block';
}

function calcSlurry() {
  const dung = parseFloat(document.getElementById('sd-dung').value) || 0;
  const mc = parseFloat(document.getElementById('sd-mc').value) || 0;
  const tts = parseFloat(document.getElementById('sd-ts').value) || 0;
  if(tts === 0) return;

  const currentTS = dung * (1 - mc/100);
  const targetTS = currentTS / (tts/100);
  const water = Math.max(0, targetTS - dung);
  const totalSlurry = dung + water;

  const res = document.getElementById('sd-result');
  res.style.display = 'block';
  res.innerHTML = `
    <h4>ফলাফল</h4>
    <div class="res-row"><span>প্রয়োজনীয় পানি</span><span>${water.toFixed(2)} লিটার</span></div>
    <div class="res-row"><span>মোট Slurry</span><span>${totalSlurry.toFixed(2)} kg</span></div>
  `;
}

function calcSizing() {
  const slurry = parseFloat(document.getElementById('bs-slurry').value) || 0;
  const hrt = parseFloat(document.getElementById('bs-hrt').value) || 0;
  const yieldGas = parseFloat(document.getElementById('bs-yield').value) || 0;
  
  const digester = slurry * hrt;
  const gasDaily = slurry * yieldGas;

  const res = document.getElementById('bs-result');
  res.style.display = 'block';
  res.innerHTML = `
    <h4>ফলাফল</h4>
    <div class="res-row"><span>Digester Volume</span><span>${digester.toFixed(2)} m³</span></div>
    <div class="res-row"><span>Daily Gas Production</span><span>${gasDaily.toFixed(2)} m³/day</span></div>
  `;
}

/* ============================================================
   4. Router & Initialization
   ============================================================ */
function router() {
  const route = getRoute();
  document.getElementById('sidebar').classList.remove('open'); // Close mobile menu on nav

  if (route === '/' || route === '') {
    renderHome();
  } else if (route.startsWith('/module/')) {
    const id = route.split('/')[2];
    renderModule(id);
  } else if (route === '/calculators') {
    renderCalculators();
  } else if (route === '/dashboard') {
    renderDashboard();
  } else {
    document.getElementById('app-content').innerHTML = '<h2>404 - পেজটি পাওয়া যায়নি</h2>';
  }
}

// Search Logic
function initSearch() {
  const input = document.getElementById('globalSearch');
  const results = document.getElementById('searchResults');

  input.addEventListener('input', () => {
    const q = input.value.toLowerCase().trim();
    if (q.length < 2) {
      results.classList.remove('show');
      return;
    }

    const matches = MODULES.filter(m => m.title.toLowerCase().includes(q) || m.summary.toLowerCase().includes(q));
    
    if (matches.length === 0) {
      results.innerHTML = '<div class="sr-item"><span>কোনো ফলাফল নেই</span></div>';
    } else {
      results.innerHTML = matches.map(m => `
        <div class="sr-item" onclick="navigate('/module/${m.id}'); document.getElementById('globalSearch').value=''; results.classList.remove('show');">
          <b>${m.num}. ${m.title}</b>
        </div>
      `).join('');
    }
    results.classList.add('show');
  });

  // Hide search on click outside
  document.addEventListener('click', (e) => {
    if (!e.target.closest('.search-wrap')) {
      results.classList.remove('show');
    }
  });
}

// Start App
document.addEventListener('DOMContentLoaded', () => {
  buildSidebar();
  initSearch();
  window.addEventListener('hashchange', router);
  router(); // Initial load
});
</script>
